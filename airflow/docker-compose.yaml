# Minimal single-machine Airflow (LocalExecutor, no Celery/Redis — DockerOperator
# already isolates each task run into its own ats-worker container, so we don't
# need Airflow-level worker parallelism infra on top of that).
#
# Usage (from repo root):
#   docker compose -f airflow/docker-compose.yaml up airflow-init
#   docker compose -f airflow/docker-compose.yaml up -d
#   -> UI at http://localhost:8080 (user: airflow / pass: airflow)

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile_inline: |
      FROM apache/airflow:2.10.4-python3.12
      RUN pip install --no-cache-dir apache-airflow-providers-docker
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # Absolute host path to the repo, so DockerOperator mounts resolve correctly
    # in sibling containers (see dags/*.py — this is NOT the in-container path).
    ATS_REPO_HOST_PATH: ${ATS_REPO_HOST_PATH}
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname Air --lastname Flow \
          --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

volumes:
  postgres-db-volume:
  airflow-logs:
